  - id: patch-8068778c
    content_hash: sha256:89985b1d34a178ea21fe96507728f1982702ed39ced0dad1274698d1af310e04
    original_commit: 8068778c257d0dedbf0a646e9fa4617b32bf2755
    original_message: Chris/sch 7517 paginate the datastream initial payload (#241)
    original_author: Christopher Brady <chris@schematichq.com>
    base_generation: cd592abd1ffc8e143b6b86d1233faa332b16eac6
    files:
      - datastream/paginated_flags_test.go
    patch_content: |
      diff --git a/datastream/paginated_flags_test.go b/datastream/paginated_flags_test.go
      new file mode 100644
      index 0000000..8179b83
      --- /dev/null
      +++ b/datastream/paginated_flags_test.go
      @@ -0,0 +1,319 @@
      +package datastream
      +
      +import (
      +	"context"
      +	"encoding/json"
      +	"sync"
      +	"testing"
      +	"time"
      +
      +	schematicdatastreamws "github.com/schematichq/schematic-datastream-ws"
      +	"github.com/schematichq/schematic-go/rulesengine"
      +	"github.com/stretchr/testify/assert"
      +	"github.com/stretchr/testify/require"
      +)
      +
      +// The server answers a flags subscription in pages when the request asks for
      +// them. What these pin is that the client treats the set as complete only on
      +// the last page. Applying a page as if it were the whole snapshot would delete
      +// every flag the other pages carry and would release a caller waiting on
      +// bootstrap with a partial set -- both silently, which is why the timing of
      +// DeleteMissing is worth asserting rather than describing.
      +
      +// recordingFlagCache is a CacheProvider that keeps what it was given, so a test
      +// can see which flags are cached and when the delete of everything absent from
      +// the snapshot ran.
      +type recordingFlagCache struct {
      +	mu                 sync.Mutex
      +	flags              map[string]*rulesengine.Flag
      +	deleteMissingCalls [][]string
      +}
      +
      +func newRecordingFlagCache() *recordingFlagCache {
      +	return &recordingFlagCache{flags: map[string]*rulesengine.Flag{}}
      +}
      +
      +func (c *recordingFlagCache) Get(_ context.Context, key string) (*rulesengine.Flag, bool) {
      +	c.mu.Lock()
      +	defer c.mu.Unlock()
      +
      +	flag, ok := c.flags[key]
      +	return flag, ok
      +}
      +
      +func (c *recordingFlagCache) Set(_ context.Context, key string, val *rulesengine.Flag, _ *time.Duration) error {
      +	c.mu.Lock()
      +	defer c.mu.Unlock()
      +
      +	c.flags[key] = val
      +	return nil
      +}
      +
      +func (c *recordingFlagCache) Delete(_ context.Context, key string) error {
      +	c.mu.Lock()
      +	defer c.mu.Unlock()
      +
      +	delete(c.flags, key)
      +	return nil
      +}
      +
      +func (c *recordingFlagCache) DeleteMissing(_ context.Context, keysToKeep []string, _ string) {
      +	c.mu.Lock()
      +	defer c.mu.Unlock()
      +
      +	c.deleteMissingCalls = append(c.deleteMissingCalls, keysToKeep)
      +	for key := range c.flags {
      +		if !containsKey(keysToKeep, key) {
      +			delete(c.flags, key)
      +		}
      +	}
      +}
      +
      +func containsKey(keys []string, key string) bool {
      +	for _, k := range keys {
      +		if k == key {
      +			return true
      +		}
      +	}
      +	return false
      +}
      +
      +func (c *recordingFlagCache) cachedKeys() []string {
      +	c.mu.Lock()
      +	defer c.mu.Unlock()
      +
      +	keys := make([]string, 0, len(c.flags))
      +	for key := range c.flags {
      +		keys = append(keys, key)
      +	}
      +	return keys
      +}
      +
      +func (c *recordingFlagCache) deleteMissingCount() int {
      +	c.mu.Lock()
      +	defer c.mu.Unlock()
      +
      +	return len(c.deleteMissingCalls)
      +}
      +
      +// flagsPageMessage renders one message of a flags snapshot. A nil pagination
      +// makes it the single-message snapshot a server without pagination sends.
      +func flagsPageMessage(t *testing.T, keys []string, pagination *schematicdatastreamws.DataStreamPagination) *schematicdatastreamws.DataStreamResp {
      +	t.Helper()
      +
      +	flags := make([]*rulesengine.Flag, 0, len(keys))
      +	for _, key := range keys {
      +		flags = append(flags, &rulesengine.Flag{
      +			ID:            "flag_" + key,
      +			AccountID:     "account_XXXX",
      +			EnvironmentID: "env_XXXX",
      +			Key:           key,
      +			DefaultValue:  true,
      +		})
      +	}
      +
      +	data, err := json.Marshal(flags)
      +	require.NoError(t, err)
      +
      +	return &schematicdatastreamws.DataStreamResp{
      +		EntityType:  string(schematicdatastreamws.EntityTypeFlags),
      +		Data:        data,
      +		Pagination:  pagination,
      +		MessageType: schematicdatastreamws.MessageTypeFull,
      +	}
      +}
      +
      +func page(hasMore bool, number, total int) *schematicdatastreamws.DataStreamPagination {
      +	return &schematicdatastreamws.DataStreamPagination{HasMore: hasMore, Page: number, Total: total}
      +}
      +
      +// quietLogger keeps a cache warning out of the test output.
      +type quietLogger struct{}
      +
      +func (quietLogger) Debug(context.Context, string, ...any) {}
      +func (quietLogger) Info(context.Context, string, ...any)  {}
      +func (quietLogger) Error(context.Context, string, ...any) {}
      +func (quietLogger) Warn(context.Context, string, ...any)  {}
      +
      +// newFlagCacheClient is a client with nothing wired but the flags cache, which
      +// is all handleFlagsMessage touches. Replicator mode supplies the cache version
      +// from a field rather than the rules engine, so the client needs no engine.
      +func newFlagCacheClient(cache *recordingFlagCache) *DataStreamClient {
      +	return &DataStreamClient{
      +		flagsCacheProvider:     cache,
      +		logger:                 quietLogger{},
      +		replicatorMode:         true,
      +		replicatorCacheVersion: "testversion",
      +	}
      +}
      +
      +func TestHandleFlagsMessage_PagesApplyAsOneSnapshot(t *testing.T) {
      +	cache := newRecordingFlagCache()
      +	client := newFlagCacheClient(cache)
      +	ctx := context.Background()
      +
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a", "b"}, page(true, 1, 5))))
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"c", "d"}, page(true, 2, 5))))
      +
      +	assert.Zero(t, cache.deleteMissingCount(), "a mid-snapshot page must not delete the pages still to come")
      +
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"e"}, page(false, 3, 5))))
      +
      +	assert.Equal(t, 1, cache.deleteMissingCount(), "the delete runs once, on the last page")
      +	assert.ElementsMatch(t,
      +		[]string{
      +			client.flagCacheKey("a"), client.flagCacheKey("b"), client.flagCacheKey("c"),
      +			client.flagCacheKey("d"), client.flagCacheKey("e"),
      +		},
      +		cache.cachedKeys(),
      +		"every page's flags survive the snapshot",
      +	)
      +}
      +
      +// A flag the server stops sending has to go, so the delete still has to happen
      +// -- against the whole snapshot's keys rather than the last page's.
      +func TestHandleFlagsMessage_FlagsAbsentFromTheSnapshotAreDropped(t *testing.T) {
      +	cache := newRecordingFlagCache()
      +	client := newFlagCacheClient(cache)
      +	ctx := context.Background()
      +
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"keep", "retire"}, page(false, 1, 2))))
      +	require.Len(t, cache.cachedKeys(), 2)
      +
      +	// A later snapshot, as a reconnect delivers, no longer carries "retire".
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"keep"}, page(false, 1, 1))))
      +
      +	assert.Equal(t, []string{client.flagCacheKey("keep")}, cache.cachedKeys())
      +}
      +
      +// An interrupted snapshot must not leave its keys behind: the next snapshot's
      +// first page starts the set over, so a flag dropped in between still goes.
      +func TestHandleFlagsMessage_InterruptedSnapshotDoesNotLeakKeys(t *testing.T) {
      +	cache := newRecordingFlagCache()
      +	client := newFlagCacheClient(cache)
      +	ctx := context.Background()
      +
      +	// First page of a snapshot that never finishes.
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"stale"}, page(true, 1, 2))))
      +
      +	// A fresh snapshot, without that flag, completes in one page.
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"current"}, page(false, 1, 1))))
      +
      +	assert.Equal(t, []string{client.flagCacheKey("current")}, cache.cachedKeys(),
      +		"the abandoned page's flag was carried into the next snapshot")
      +}
      +
      +// A server without pagination sends one message and no pagination field, which
      +// must still be applied as the whole set.
      +func TestHandleFlagsMessage_UnpaginatedSnapshotAppliesWhole(t *testing.T) {
      +	cache := newRecordingFlagCache()
      +	client := newFlagCacheClient(cache)
      +	ctx := context.Background()
      +
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a", "b"}, nil)))
      +
      +	assert.Equal(t, 1, cache.deleteMissingCount())
      +	assert.ElementsMatch(t, []string{client.flagCacheKey("a"), client.flagCacheKey("b")}, cache.cachedKeys())
      +}
      +
      +// The transport drops a message when its queue is full (default 100, and a
      +// snapshot is now many messages), so a page can go missing. These cover the
      +// two ways that shows up, and both must fail the snapshot rather than complete
      +// one with a hole: the delete would take the missing page's flags out of the
      +// cache, and no error would reach the caller.
      +
      +func TestHandleFlagsMessage_MissingPageAbandonsTheSnapshot(t *testing.T) {
      +	cache := newRecordingFlagCache()
      +	client := newFlagCacheClient(cache)
      +	ctx := context.Background()
      +
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a"}, page(true, 1, 3))))
      +
      +	// Page 2 never arrives.
      +	err := client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"c"}, page(false, 3, 3)))
      +	require.Error(t, err, "a gap in the pages must be reported")
      +	assert.Contains(t, err.Error(), "expected 2")
      +
      +	assert.Zero(t, cache.deleteMissingCount(), "an incomplete snapshot must not delete anything")
      +	assert.Equal(t, []string{client.flagCacheKey("a")}, cache.cachedKeys(),
      +		"what arrived stays; the cache is left a superset rather than missing flags")
      +}
      +
      +func TestHandleFlagsMessage_ShortSnapshotAbandonsTheSnapshot(t *testing.T) {
      +	cache := newRecordingFlagCache()
      +	client := newFlagCacheClient(cache)
      +	ctx := context.Background()
      +
      +	// One page, in sequence, but carrying fewer flags than the server said the
      +	// snapshot holds.
      +	err := client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"only"}, page(false, 1, 5)))
      +	require.Error(t, err, "a snapshot short of its own total must be reported")
      +	assert.Contains(t, err.Error(), "expected 5")
      +
      +	assert.Zero(t, cache.deleteMissingCount())
      +}
      +
      +// A snapshot that starts over after an abandoned one must still work: page 1
      +// resets the sequence, so a reconnect recovers without a restart.
      +func TestHandleFlagsMessage_SnapshotRecoversAfterAnAbandonedOne(t *testing.T) {
      +	cache := newRecordingFlagCache()
      +	client := newFlagCacheClient(cache)
      +	ctx := context.Background()
      +
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a"}, page(true, 1, 3))))
      +	require.Error(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"c"}, page(false, 3, 3))))
      +
      +	// A fresh snapshot, complete this time.
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"x"}, page(true, 1, 2))))
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"y"}, page(false, 2, 2))))
      +
      +	assert.Equal(t, 1, cache.deleteMissingCount(), "the recovered snapshot applies once")
      +	assert.ElementsMatch(t, []string{client.flagCacheKey("x"), client.flagCacheKey("y")}, cache.cachedKeys(),
      +		"the abandoned snapshot's flag is gone, since the recovered one did not carry it")
      +}
      +
      +// TestHandleFlagsMessage_OrphanPageIsRefused pins the zero value of
      +// snapshotNextPage: no snapshot in progress accepts page 1 and nothing else. A
      +// page arriving without its snapshot's beginning means the pages before it were
      +// dropped -- the server sends a whole snapshot before any update, so they are
      +// not still coming -- and applying it would complete a snapshot from one page.
      +func TestHandleFlagsMessage_OrphanPageIsRefused(t *testing.T) {
      +	cache := newRecordingFlagCache()
      +	client := newFlagCacheClient(cache)
      +	ctx := context.Background()
      +
      +	// A fresh client, and the first thing it sees is page 3 of 3.
      +	err := client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"c"}, page(false, 3, 3)))
      +	require.Error(t, err, "a page with no snapshot in progress must be refused")
      +	assert.Contains(t, err.Error(), "expected 0")
      +
      +	assert.Zero(t, cache.deleteMissingCount())
      +	assert.Empty(t, cache.cachedKeys(), "an orphan page must not seed the cache")
      +
      +	// And the client is still able to take a snapshot that starts properly.
      +	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a"}, page(false, 1, 1))))
      +	assert.Equal(t, []string{client.flagCacheKey("a")}, cache.cachedKeys())
      +}
      +
      +// TestFlagPageSize covers what a client ends up asking the server for. A size
      +// that is not a page -- zero from a caller that set nothing, or a negative --
      +// takes the default rather than travelling to the server, which would clamp it
      +// anyway but only after the request had said something it did not mean.
      +func TestFlagPageSize(t *testing.T) {
      +	tests := []struct {
      +		name       string
      +		configured int
      +		want       int
      +	}{
      +		{name: "unset takes the default", configured: 0, want: defaultFlagSnapshotPageSize},
      +		{name: "negative takes the default", configured: -10, want: defaultFlagSnapshotPageSize},
      +		{name: "one is a legitimate page", configured: 1, want: 1},
      +		{name: "a configured size is used", configured: 25, want: 25},
      +	}
      +
      +	for _, test := range tests {
      +		t.Run(test.name, func(t *testing.T) {
      +			assert.Equal(t, test.want, flagPageSize(test.configured))
      +		})
      +	}
      +}
    theirs_snapshot:
      datastream/paginated_flags_test.go: |
        package datastream

        import (
        	"context"
        	"encoding/json"
        	"sync"
        	"testing"
        	"time"

        	schematicdatastreamws "github.com/schematichq/schematic-datastream-ws"
        	"github.com/schematichq/schematic-go/rulesengine"
        	"github.com/stretchr/testify/assert"
        	"github.com/stretchr/testify/require"
        )

        // The server answers a flags subscription in pages when the request asks for
        // them. What these pin is that the client treats the set as complete only on
        // the last page. Applying a page as if it were the whole snapshot would delete
        // every flag the other pages carry and would release a caller waiting on
        // bootstrap with a partial set -- both silently, which is why the timing of
        // DeleteMissing is worth asserting rather than describing.

        // recordingFlagCache is a CacheProvider that keeps what it was given, so a test
        // can see which flags are cached and when the delete of everything absent from
        // the snapshot ran.
        type recordingFlagCache struct {
        	mu                 sync.Mutex
        	flags              map[string]*rulesengine.Flag
        	deleteMissingCalls [][]string
        }

        func newRecordingFlagCache() *recordingFlagCache {
        	return &recordingFlagCache{flags: map[string]*rulesengine.Flag{}}
        }

        func (c *recordingFlagCache) Get(_ context.Context, key string) (*rulesengine.Flag, bool) {
        	c.mu.Lock()
        	defer c.mu.Unlock()

        	flag, ok := c.flags[key]
        	return flag, ok
        }

        func (c *recordingFlagCache) Set(_ context.Context, key string, val *rulesengine.Flag, _ *time.Duration) error {
        	c.mu.Lock()
        	defer c.mu.Unlock()

        	c.flags[key] = val
        	return nil
        }

        func (c *recordingFlagCache) Delete(_ context.Context, key string) error {
        	c.mu.Lock()
        	defer c.mu.Unlock()

        	delete(c.flags, key)
        	return nil
        }

        func (c *recordingFlagCache) DeleteMissing(_ context.Context, keysToKeep []string, _ string) {
        	c.mu.Lock()
        	defer c.mu.Unlock()

        	c.deleteMissingCalls = append(c.deleteMissingCalls, keysToKeep)
        	for key := range c.flags {
        		if !containsKey(keysToKeep, key) {
        			delete(c.flags, key)
        		}
        	}
        }

        func containsKey(keys []string, key string) bool {
        	for _, k := range keys {
        		if k == key {
        			return true
        		}
        	}
        	return false
        }

        func (c *recordingFlagCache) cachedKeys() []string {
        	c.mu.Lock()
        	defer c.mu.Unlock()

        	keys := make([]string, 0, len(c.flags))
        	for key := range c.flags {
        		keys = append(keys, key)
        	}
        	return keys
        }

        func (c *recordingFlagCache) deleteMissingCount() int {
        	c.mu.Lock()
        	defer c.mu.Unlock()

        	return len(c.deleteMissingCalls)
        }

        // flagsPageMessage renders one message of a flags snapshot. A nil pagination
        // makes it the single-message snapshot a server without pagination sends.
        func flagsPageMessage(t *testing.T, keys []string, pagination *schematicdatastreamws.DataStreamPagination) *schematicdatastreamws.DataStreamResp {
        	t.Helper()

        	flags := make([]*rulesengine.Flag, 0, len(keys))
        	for _, key := range keys {
        		flags = append(flags, &rulesengine.Flag{
        			ID:            "flag_" + key,
        			AccountID:     "account_XXXX",
        			EnvironmentID: "env_XXXX",
        			Key:           key,
        			DefaultValue:  true,
        		})
        	}

        	data, err := json.Marshal(flags)
        	require.NoError(t, err)

        	return &schematicdatastreamws.DataStreamResp{
        		EntityType:  string(schematicdatastreamws.EntityTypeFlags),
        		Data:        data,
        		Pagination:  pagination,
        		MessageType: schematicdatastreamws.MessageTypeFull,
        	}
        }

        func page(hasMore bool, number, total int) *schematicdatastreamws.DataStreamPagination {
        	return &schematicdatastreamws.DataStreamPagination{HasMore: hasMore, Page: number, Total: total}
        }

        // quietLogger keeps a cache warning out of the test output.
        type quietLogger struct{}

        func (quietLogger) Debug(context.Context, string, ...any) {}
        func (quietLogger) Info(context.Context, string, ...any)  {}
        func (quietLogger) Error(context.Context, string, ...any) {}
        func (quietLogger) Warn(context.Context, string, ...any)  {}

        // newFlagCacheClient is a client with nothing wired but the flags cache, which
        // is all handleFlagsMessage touches. Replicator mode supplies the cache version
        // from a field rather than the rules engine, so the client needs no engine.
        func newFlagCacheClient(cache *recordingFlagCache) *DataStreamClient {
        	return &DataStreamClient{
        		flagsCacheProvider:     cache,
        		logger:                 quietLogger{},
        		replicatorMode:         true,
        		replicatorCacheVersion: "testversion",
        	}
        }

        func TestHandleFlagsMessage_PagesApplyAsOneSnapshot(t *testing.T) {
        	cache := newRecordingFlagCache()
        	client := newFlagCacheClient(cache)
        	ctx := context.Background()

        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a", "b"}, page(true, 1, 5))))
        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"c", "d"}, page(true, 2, 5))))

        	assert.Zero(t, cache.deleteMissingCount(), "a mid-snapshot page must not delete the pages still to come")

        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"e"}, page(false, 3, 5))))

        	assert.Equal(t, 1, cache.deleteMissingCount(), "the delete runs once, on the last page")
        	assert.ElementsMatch(t,
        		[]string{
        			client.flagCacheKey("a"), client.flagCacheKey("b"), client.flagCacheKey("c"),
        			client.flagCacheKey("d"), client.flagCacheKey("e"),
        		},
        		cache.cachedKeys(),
        		"every page's flags survive the snapshot",
        	)
        }

        // A flag the server stops sending has to go, so the delete still has to happen
        // -- against the whole snapshot's keys rather than the last page's.
        func TestHandleFlagsMessage_FlagsAbsentFromTheSnapshotAreDropped(t *testing.T) {
        	cache := newRecordingFlagCache()
        	client := newFlagCacheClient(cache)
        	ctx := context.Background()

        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"keep", "retire"}, page(false, 1, 2))))
        	require.Len(t, cache.cachedKeys(), 2)

        	// A later snapshot, as a reconnect delivers, no longer carries "retire".
        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"keep"}, page(false, 1, 1))))

        	assert.Equal(t, []string{client.flagCacheKey("keep")}, cache.cachedKeys())
        }

        // An interrupted snapshot must not leave its keys behind: the next snapshot's
        // first page starts the set over, so a flag dropped in between still goes.
        func TestHandleFlagsMessage_InterruptedSnapshotDoesNotLeakKeys(t *testing.T) {
        	cache := newRecordingFlagCache()
        	client := newFlagCacheClient(cache)
        	ctx := context.Background()

        	// First page of a snapshot that never finishes.
        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"stale"}, page(true, 1, 2))))

        	// A fresh snapshot, without that flag, completes in one page.
        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"current"}, page(false, 1, 1))))

        	assert.Equal(t, []string{client.flagCacheKey("current")}, cache.cachedKeys(),
        		"the abandoned page's flag was carried into the next snapshot")
        }

        // A server without pagination sends one message and no pagination field, which
        // must still be applied as the whole set.
        func TestHandleFlagsMessage_UnpaginatedSnapshotAppliesWhole(t *testing.T) {
        	cache := newRecordingFlagCache()
        	client := newFlagCacheClient(cache)
        	ctx := context.Background()

        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a", "b"}, nil)))

        	assert.Equal(t, 1, cache.deleteMissingCount())
        	assert.ElementsMatch(t, []string{client.flagCacheKey("a"), client.flagCacheKey("b")}, cache.cachedKeys())
        }

        // The transport drops a message when its queue is full (default 100, and a
        // snapshot is now many messages), so a page can go missing. These cover the
        // two ways that shows up, and both must fail the snapshot rather than complete
        // one with a hole: the delete would take the missing page's flags out of the
        // cache, and no error would reach the caller.

        func TestHandleFlagsMessage_MissingPageAbandonsTheSnapshot(t *testing.T) {
        	cache := newRecordingFlagCache()
        	client := newFlagCacheClient(cache)
        	ctx := context.Background()

        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a"}, page(true, 1, 3))))

        	// Page 2 never arrives.
        	err := client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"c"}, page(false, 3, 3)))
        	require.Error(t, err, "a gap in the pages must be reported")
        	assert.Contains(t, err.Error(), "expected 2")

        	assert.Zero(t, cache.deleteMissingCount(), "an incomplete snapshot must not delete anything")
        	assert.Equal(t, []string{client.flagCacheKey("a")}, cache.cachedKeys(),
        		"what arrived stays; the cache is left a superset rather than missing flags")
        }

        func TestHandleFlagsMessage_ShortSnapshotAbandonsTheSnapshot(t *testing.T) {
        	cache := newRecordingFlagCache()
        	client := newFlagCacheClient(cache)
        	ctx := context.Background()

        	// One page, in sequence, but carrying fewer flags than the server said the
        	// snapshot holds.
        	err := client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"only"}, page(false, 1, 5)))
        	require.Error(t, err, "a snapshot short of its own total must be reported")
        	assert.Contains(t, err.Error(), "expected 5")

        	assert.Zero(t, cache.deleteMissingCount())
        }

        // A snapshot that starts over after an abandoned one must still work: page 1
        // resets the sequence, so a reconnect recovers without a restart.
        func TestHandleFlagsMessage_SnapshotRecoversAfterAnAbandonedOne(t *testing.T) {
        	cache := newRecordingFlagCache()
        	client := newFlagCacheClient(cache)
        	ctx := context.Background()

        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a"}, page(true, 1, 3))))
        	require.Error(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"c"}, page(false, 3, 3))))

        	// A fresh snapshot, complete this time.
        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"x"}, page(true, 1, 2))))
        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"y"}, page(false, 2, 2))))

        	assert.Equal(t, 1, cache.deleteMissingCount(), "the recovered snapshot applies once")
        	assert.ElementsMatch(t, []string{client.flagCacheKey("x"), client.flagCacheKey("y")}, cache.cachedKeys(),
        		"the abandoned snapshot's flag is gone, since the recovered one did not carry it")
        }

        // TestHandleFlagsMessage_OrphanPageIsRefused pins the zero value of
        // snapshotNextPage: no snapshot in progress accepts page 1 and nothing else. A
        // page arriving without its snapshot's beginning means the pages before it were
        // dropped -- the server sends a whole snapshot before any update, so they are
        // not still coming -- and applying it would complete a snapshot from one page.
        func TestHandleFlagsMessage_OrphanPageIsRefused(t *testing.T) {
        	cache := newRecordingFlagCache()
        	client := newFlagCacheClient(cache)
        	ctx := context.Background()

        	// A fresh client, and the first thing it sees is page 3 of 3.
        	err := client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"c"}, page(false, 3, 3)))
        	require.Error(t, err, "a page with no snapshot in progress must be refused")
        	assert.Contains(t, err.Error(), "expected 0")

        	assert.Zero(t, cache.deleteMissingCount())
        	assert.Empty(t, cache.cachedKeys(), "an orphan page must not seed the cache")

        	// And the client is still able to take a snapshot that starts properly.
        	require.NoError(t, client.handleFlagsMessage(ctx, flagsPageMessage(t, []string{"a"}, page(false, 1, 1))))
        	assert.Equal(t, []string{client.flagCacheKey("a")}, cache.cachedKeys())
        }

        // TestFlagPageSize covers what a client ends up asking the server for. A size
        // that is not a page -- zero from a caller that set nothing, or a negative --
        // takes the default rather than travelling to the server, which would clamp it
        // anyway but only after the request had said something it did not mean.
        func TestFlagPageSize(t *testing.T) {
        	tests := []struct {
        		name       string
        		configured int
        		want       int
        	}{
        		{name: "unset takes the default", configured: 0, want: defaultFlagSnapshotPageSize},
        		{name: "negative takes the default", configured: -10, want: defaultFlagSnapshotPageSize},
        		{name: "one is a legitimate page", configured: 1, want: 1},
        		{name: "a configured size is used", configured: 25, want: 25},
        	}

        	for _, test := range tests {
        		t.Run(test.name, func(t *testing.T) {
        			assert.Equal(t, test.want, flagPageSize(test.configured))
        		})
        	}
        }
    user_owned: true
