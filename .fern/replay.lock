          test:
            runs-on: ubuntu-latest
            steps:
              - name: Checkout repo
                uses: actions/checkout@v4

              - name: Set up go
                uses: actions/setup-go@v6
                with:
                  go-version-file: go.mod

              - name: Setup wiremock server
                run: |
                  PROJECT_NAME="wiremock-$(basename $(dirname $(pwd)) | tr -d '.')"
