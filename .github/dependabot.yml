# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod" # See documentation for possible values
    directories:
      - "/."
    schedule:
      interval: "daily"
    labels:
      - "gomod"
      - "Dependabot"
    ignore:
      # 9.23 takes a weak.Pointer to its own Client, and Go compiles that
      # generic, with a wrapper for each of Client's ~730 methods, into every
      # package that reaches the type. In schematic-api that made test
      # compiles ~37% slower. Lift once upstream drops the pointer to Client.
      - dependency-name: "github.com/redis/go-redis/v9"
        versions: [">= 9.23.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "github-actions"
      - "Dependabot"
    assignees:
      - "mhmdio"
